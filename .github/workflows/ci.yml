# ============================================================================
# 模块级 CI workflow（wasm 目标模块用）
#
# 本模块是独立 git 仓库，workflow 必须放在本模块 .github/workflows/ 下才会被 GitHub Actions 触发。
#
# 两个 job（互不替代）：
#   · five-gates   —— 五道门禁（合入硬门禁），顺序执行，任一步非 0 即该 job 失败。
#   · meta-contract—— 脚本层元契约（W2/W5）：`tools/verify.sh --no-native`，复验
#                     错误簿记 8/8 + 截断/变异自检 + 引用实存性 + oracle 机制自检。
#                     退出码 78（真实模型差分显式 SKIPPED）按成功处理。
#
# 五道门禁（顺序执行，任一步非 0 即整 job 失败）：
#   1. moon check --deny-warn
#   2. moon build
#   3. moon test
#   4. moon fmt --check
#   5. moon info && git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti
#      （pkg.generated.mbti 快照与源码一致性 fail-closed；cmd/main 下的快照同样纳入 diff 范围。
#        纳入范围 = 本仓库内受版本控制且由 moon info 生成的全部快照，即仓库根与 cmd/main 两处；
#        非 moon info 生成的存档与第三方包缓存下的快照不受本仓库版本控制，不在 diff 范围。）
# （可选 moon clean：仅清理，continue-on-error，不参与判定）
#
# 工具链版本说明：
#   （2026-11-19 起不再钉死：安装脚本只提供 latest，版本化产物一律 HTTP 403，
#     详见下方依赖策略末条）
#
# 依赖策略（详见 docs/2026-11-17-backend-neutral-facade-dev-plan.md §1 硬约束 3）：
#   - 禁止无版本 `moon update`：`moon update --help` 实测只有 --target-dir/-q/-v/--trace/--dry-run，
#     没有任何锁定版本的参数，因此 CI 中一律不出现 `moon update`。
#   - 依赖只按本模块 moon.mod 中已钉死的版本声明由 check/build 自动同步。
#   - 如确需显式预取：`moon fetch <author>/<name>@<version> --no-update`（钉死版本且不刷新 registry 元数据）。
#   - 不用 `moon build --frozen`：全新 checkout 没有本地依赖缓存，--frozen 会直接失败。
#   - 工具链安装（2026-11-19 修正）：cli.moonbitlang.com 只提供 latest/nightly，版本化产物
#     `binaries/<版本>/...` 与 `cores/core-<版本>.tar.gz` 一律 HTTP 403（2026-11-19 实测
#     0.1.20261104 与 0.1.20261117 均 403，仅 latest 返回 200），`unix.sh <版本>` 参数不可能成功；
#     旧策略「钉死版本 + 回退 latest + 精确版本断言」逻辑自相矛盾，latest 前进后断言必然失败。
#     现改为：显式安装 latest（失败即 fail，不做静默回退）；打印实际版本供日志追溯；只断言
#     可验证的不变量（moon 来自本次安装目录、三件套均在、core 已安装）。版本漂移不再硬失败。
# ============================================================================
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-gates:
    name: five-gates (pose)
    runs-on: ubuntu-latest
    # 本模块 preferred_target = "wasm"：五道门禁全部在 wasm 后端执行。
    # 同序门禁曾在 Windows/MSVC x86_64 主机本地等价实跑通过（本机等价实跑，非 GitHub Actions 已跑通）。
    steps:
      - name: Checkout pose
        uses: actions/checkout@v5

      - name: Install MoonBit toolchain (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon/tmp"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$HOME/.moon/tmp/install.sh"
          bash "$HOME/.moon/tmp/install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain installation (moon / moonc / moonrun / core)
        shell: bash
        run: |
          set -euo pipefail
          out="$(moon version --all)"
          echo "$out"
          moon_path="$(command -v moon)"
          if [[ "$moon_path" != "$HOME/.moon/bin/moon" ]]; then
            echo "::error::moon resolves to $moon_path, expected $HOME/.moon/bin/moon (a stale toolchain is earlier on PATH)"
            exit 1
          fi
          for tool in moon moonc moonrun; do
            grep -qE "^$tool " <<<"$out" || {
              echo "::error::$tool missing from 'moon version --all'"
              exit 1
            }
          done
          core_mod="$HOME/.moon/lib/core/moon.mod"
          if [[ ! -f "$core_mod" ]]; then
            echo "::error::missing $core_mod (core not installed)"
            exit 1
          fi
          echo "--- $core_mod ---"
          grep -E '^(name|version) *=' "$core_mod" || true

      # ---- 五道门禁：顺序执行，任一非 0 即失败 ----
      - name: "Gate 1/5 · moon check --deny-warn"
        shell: bash
        run: moon check --deny-warn

      - name: "Gate 2/5 · moon build"
        shell: bash
        run: moon build

      - name: "Gate 3/5 · moon test"
        shell: bash
        run: moon test

      - name: "Gate 4/5 · moon fmt --check"
        shell: bash
        run: moon fmt --check

      - name: "Gate 5/5 · moon info && git diff --exit-code -- pkg.generated.mbti"
        shell: bash
        run: |
          set -euo pipefail
          moon info
          if ! git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti; then
            echo "::error::Gate 5/5 failed: pkg.generated.mbti snapshot out of sync with sources. Run 'moon info' locally and commit the regenerated snapshot together with the API change (additive changes should also be noted in docs/CHANGELOG.md; freeze policy: see docs/2026-11-17-backend-neutral-facade-dev-plan.md §1 / README.md)."
            exit 1
          fi
          echo "Gate 5/5 OK: snapshot in sync (pkg.generated.mbti + cmd/main/pkg.generated.mbti)"

      - name: "Optional · moon clean (not a gate)"
        shell: bash
        continue-on-error: true
        run: moon clean

  # ==========================================================================
  # 元契约 job（W2/W5 脚本层门禁）：仓库自包含地复验「五门禁 + 错误簿记 8/8
  # + 截断/变异自检 + 引用实存性 + oracle runner 机制自检」。
  #
  # 说明：
  #   - 与 five-gates job 互补：five-gates 只跑五门禁；本 job 额外跑元契约，
  #     二者互不替代（五门禁仍是合入硬门禁）。
  #   - native 双目标等价依赖 runner 主机 C 工具链，尚未在 GitHub Actions 实跑
  #     验证（本机等价实跑已通过），故此处用 --no-native 跳过；需要时显式去掉。
  #   - verify.sh 退出码 78 = 除「真实模型差分」外全绿。真实差分因许可红线只允许
  #     仓库外本地路径 + 显式 SKIPPED，永不进通过计数，故 78 按成功处理。
  # ==========================================================================
  meta-contract:
    name: meta-contract (pose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pose
        uses: actions/checkout@v5

      - name: Install MoonBit toolchain (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon/tmp"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$HOME/.moon/tmp/install.sh"
          bash "$HOME/.moon/tmp/install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: "Meta-contract · bash tools/verify.sh --no-native"
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          bash tools/verify.sh --no-native || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "meta-contract OK (all green, incl. real oracle diff)"
            exit 0
          fi
          if [ "$rc" -eq 78 ]; then
            echo "meta-contract OK (rc=78: 真实模型差分显式 SKIPPED，不计入通过)"
            exit 0
          fi
          echo "::error::meta-contract failed (rc=$rc); see tools/verify.sh output above"
          exit "$rc"
