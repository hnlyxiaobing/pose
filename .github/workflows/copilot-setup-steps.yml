# Reference: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
#
# 工具链版本说明（2026-11-19 修正）：
#   1) 安装 MoonBit 改为显式 latest：cli.moonbitlang.com 只提供 latest/nightly，
#      版本化产物一律 HTTP 403，旧策略「钉死版本 + 版本断言」在 latest 前进后必然失败；
#   2) 删除无版本的 `moon update`（`moon update --help` 实测只有 --target-dir/-q/-v/--trace/--dry-run，
#      没有任何锁定版本的参数，不满足「禁用无版本 moon update」要求）；
#      依赖改为按 moon.mod 中钉死的版本声明由 build 自动同步获取；
#   3) 真正的四道门禁（check --deny-warn → build → test → fmt --check）在同目录 ci.yml。
name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon/tmp"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$HOME/.moon/tmp/install.sh"
          bash "$HOME/.moon/tmp/install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain installation
        shell: bash
        run: |
          set -euo pipefail
          out="$(moon version --all)"
          echo "$out"
          for tool in moon moonc moonrun; do
            grep -qE "^$tool " <<<"$out"
          done
          test -f "$HOME/.moon/lib/core/moon.mod"

      # 已删除：`moon update`（无版本、不可复现）。
      # 依赖获取：直接使用 moon.mod 中已钉死的版本声明，由 moon check/build 自动同步；
      # 如确需预取，用 `moon fetch <author>/<name>@<version> --no-update`。
